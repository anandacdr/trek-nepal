<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trek details — Trek Nepal</title>
<meta name="description" content="Full itinerary, price, difficulty and departure dates for our Nepal trekking packages.">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
.phero{position:relative;height:min(62vh,540px);min-height:320px;overflow:hidden;
  display:flex;align-items:flex-end}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(8,16,22,.45) 0%,transparent 38%,rgba(8,16,22,.85) 100%)}
.phero .in{position:relative;z-index:2;width:100%;padding-bottom:clamp(28px,5vh,50px)}
.phero h1{font-size:clamp(30px,5vw,58px);color:#fff;margin:14px 0 0;max-width:20ch}
.phero .crumbs{color:#a9bcc9}
.phero .crumbs a{color:#a9bcc9}
.phero .crumbs a:hover{color:#fff}

.layout{display:grid;grid-template-columns:1fr 380px;gap:clamp(30px,4vw,64px);align-items:start}
.prose h2{font-size:clamp(24px,3vw,34px);margin:0 0 18px}
.prose p{color:var(--ink-2);margin:0 0 18px}
.block{margin-bottom:clamp(40px,6vh,64px)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.hl li{display:flex;gap:14px;align-items:flex-start;color:var(--ink-2);font-size:15.5px}
.hl svg{flex:none;margin-top:5px;color:var(--ember)}

.itin{border-top:1px solid var(--line)}
.itin .row{display:grid;grid-template-columns:56px 1fr 96px;gap:18px;align-items:center;
  padding:17px 4px;border-bottom:1px solid var(--line)}
.itin .d{font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--ember)}
.itin .t{font-size:15.5px;color:var(--ink)}
.itin .m{text-align:right;font:600 12px/1 ui-monospace,monospace;color:var(--muted)}

/* sticky booking card */
.book{position:sticky;top:calc(var(--nav-h) + 20px);background:var(--card);
  border:1px solid var(--line);padding:28px}
.book .amt{font:600 38px/1 ui-monospace,Menlo,monospace;color:var(--ink);
  display:inline-flex;align-items:flex-start;gap:2px}
.book .amt sup{font-size:.55em;line-height:1.1;position:static;vertical-align:baseline;
  color:var(--muted);font-weight:600}
.book .per{font-size:12px;color:var(--muted);margin:8px 0 22px}
.book dl{margin:0 0 24px;display:grid;gap:1px;background:var(--line);
  border:1px solid var(--line)}
.book dl>div{background:var(--card);display:flex;justify-content:space-between;
  gap:14px;padding:13px 15px}
.book dt{font:600 10px/1.4 ui-sans-serif,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.book dd{margin:0;font:600 13px/1.4 ui-monospace,monospace;color:var(--ink);text-align:right}
.book .btn{width:100%}
.book .note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}

.storycta{margin-top:20px;padding:20px;border:1px dashed var(--line-2);text-align:center}
.storycta p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}

.more{background:var(--paper-2);border-top:1px solid var(--line)}
#notfound{padding:16vh 0;text-align:center}

@media (max-width:960px){
  .layout{grid-template-columns:1fr}
  .book{position:static}
}
@media (max-width:520px){
  .itin .row{grid-template-columns:44px 1fr;gap:12px}
  .itin .m{grid-column:2;text-align:left;margin-top:-6px}
}
</style>
</head>
<body class="has-solid-nav">
<div id="site-nav"></div>
<main id="main"><div id="app"></div></main>
<div id="site-foot"></div>

<script>window.SITE_PREFIX = "../";</script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/site.js"></script>
<script>
(function(){
  // window.TREK_SLUG is baked in by tools/prerender.mjs for the static pages;
  // the query string is the fallback for legacy ?trek= links.
  const slug = window.TREK_SLUG || new URLSearchParams(location.search).get("trek");
  const p = pkgBySlug(slug);
  const app = document.getElementById("app");

  if(!p){
    app.innerHTML = `
      <section id="notfound" class="wrap">
        <p class="eyebrow">404</p>
        <h1 style="font-size:clamp(30px,5vw,52px);margin:14px 0 18px">That trek doesn't exist.</h1>
        <p style="color:var(--ink-2);margin-bottom:30px">The link may be out of date. Browse everything we run instead.</p>
        <a class="btn" href="../treks/index.html">All packages</a>
      </section>`;
    return;
  }

  document.title = p.title + " — Trek Nepal";
  const tick  = '<svg width="15" height="12" viewBox="0 0 15 12" fill="none" aria-hidden="true"><path d="M1 6.2 5.2 10.4 14 1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const cross = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  app.innerHTML = `
    <header class="phero">
      <img src="${url(p.img)}" alt="${p.alt}" width="1200" height="800">
      <div class="in wrap-wide">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="../index.html">Home</a><span>›</span>
          <a href="../treks/index.html">Packages</a><span>›</span>
          <span>${p.short || p.title}</span>
        </nav>
        <div class="tags" style="position:static;margin-bottom:6px">
          <span class="tag">${p.country}</span>
          <span class="tag ${p.grade.toLowerCase()}">${p.grade}</span>
          <span class="tag">${p.duration}</span>
        </div>
        <h1>${p.title}</h1>
      </div>
    </header>

    <section class="sec">
      <div class="wrap-wide layout">
        <div class="prose">
          <div class="block">
            <p class="eyebrow">Overview</p>
            <h2>${p.short || p.title}</h2>
            <p>${p.blurb}</p>
          </div>

          <div class="block">
            <h2>Trip highlights</h2>
            <ul class="hl">${p.highlights.map(h => `<li>${tick}<span>${h}</span></li>`).join("")}</ul>
          </div>

          <div class="block">
            <h2>What's included</h2>
            <div class="incl">
              <div class="yes">
                <h3>In the price</h3>
                <ul>${INCLUDED.map(i => `<li>${tick}<span>${i}</span></li>`).join("")}</ul>
              </div>
              <div class="no">
                <h3>Not included</h3>
                <ul>${EXCLUDED.map(i => `<li>${cross}<span>${i}</span></li>`).join("")}</ul>
              </div>
            </div>
          </div>

          <div class="block">
            <h2>Day by day</h2>
            <div class="itin">
              ${p.itinerary.map(([d,t,m]) => `
                <div class="row">
                  <span class="d">DAY ${d}</span>
                  <span class="t">${t}</span>
                  <span class="m">${m}</span>
                </div>`).join("")}
            </div>
          </div>

          <div class="block" style="margin-bottom:0">
            <h2>Common questions</h2>
            <div class="faq">
              ${FAQS.map(([q,a]) => `
                <details>
                  <summary>${q}</summary>
                  <p class="a">${a}</p>
                </details>`).join("")}
            </div>
          </div>
        </div>

        <aside>
          <div class="book">
            <span class="from">Starting from</span>
            <div class="amt"><sup>$</sup>${p.price.toLocaleString()}</div>
            <p class="per">per person, twin share · all permits included</p>
            <dl>
              <div><dt>Duration</dt><dd>${p.duration}</dd></div>
              <div><dt>Max altitude</dt><dd>${p.max.toLocaleString()} m</dd></div>
              <div><dt>Difficulty</dt><dd>${p.grade}</dd></div>
              <div><dt>Best season</dt><dd>${p.best}</dd></div>
              <div><dt>Group size</dt><dd>${p.group}</dd></div>
            </dl>
            <a class="btn" href="../contact/index.html?trek=${p.slug}">Check dates</a>
            <p class="note">No deposit to enquire · Replies within 24 h</p>

            ${p.story ? `
            <div class="storycta">
              <p><strong>Want to see it first?</strong> Walk the whole route as an interactive climb.</p>
              <a class="btn ghost" href="../${p.story}" style="width:100%">Start the climb</a>
            </div>` : ``}
          </div>
        </aside>
      </div>
    </section>

    <section class="sec more">
      <div class="wrap-wide">
        <div class="shead">
          <div><p class="eyebrow">You might also like</p>
          <h2>Other trips in Nepal.</h2></div>
          <a class="btn ghost" href="../treks/index.html">View all</a>
        </div>
        <div class="pkg-grid reveal in">
          ${PACKAGES.filter(x => x.slug !== p.slug).slice(0,3).map(x => pkgCard(x)).join("")}
        </div>
      </div>
    </section>`;
})();
</script>
</body>
</html>
